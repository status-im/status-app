name: Changes

# Tells the calling workflow whether a pull request touches anything but documentation.
on:
  workflow_call:
    outputs:
      code:
        description: "'false' when every changed file is Markdown or under docs/."
        value: ${{ jobs.files.outputs.code }}

jobs:
  files:
    name: files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A push or a manual run always builds.
          if [[ -z "$PR" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qvE '\.md$|^docs/' <<< "$files"; then code=true; else code=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
