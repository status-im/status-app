name: Android

on:
  pull_request:
  # Runs on master save the ccache that pull requests restore.
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IN_IMAGE: docker exec build
  QT: /opt/qt/6.11.0

jobs:
  apk:
    name: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The app's version is git describe of the pull request's head.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch submodules
        env:
          USE_SYSTEM_NIM: '1'
        run: scripts/ci-fetch-submodules.sh --mobile

      - uses: ./.github/actions/container
        with:
          image: android
          env: |
            QMAKE=${{ env.QT }}/android_arm64_v8a/bin/qmake
            BUILD_VARIANT=pr
            STATUSQ_TESTMODE=true
            FLAG_SWAP_ENABLED=1
            FLAG_RELAY_ENABLED=1
            FLAG_LIFI_ENABLED=0
            FLAG_PARASWAP_ENABLED=0
            STATUS_APP_KEYSTORE_PATH=/tmp/throwaway.keystore
            STATUS_APP_KEYSTORE_PASSWORD=throwaway
            STATUS_APP_KEY_ALIAS=throwaway
            STATUS_APP_KEY_PASSWORD=throwaway
            QMAKE_EXTRA_CONFIG=ccache
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            CCACHE_DIR=${{ github.workspace }}/.ccache
            CCACHE_MAXSIZE=2G

      # Compiled objects of StatusQ and of the app's QML, kept between runs.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: ccache
        with:
          path: .ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      - name: QML lint
        run: $IN_IMAGE make qml-lint-mobile "QTDIR=$QT/gcc_64" "QT_MOBILE_DIR=$QT/android_arm64_v8a"

      # The release build must be signed; this key lives for one run.
      - name: Signing key
        run: |
          $IN_IMAGE sh -c 'keytool -genkeypair -keystore "$STATUS_APP_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass "$STATUS_APP_KEYSTORE_PASSWORD" -alias "$STATUS_APP_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Status PR build"'

      # The Nim compiler reads the three keys from its environment.
      - name: Build
        env:
          STATUS_BUILD_LIFI_API_KEY: ${{ secrets.STATUS_BUILD_LIFI_API_KEY }}
          STATUS_BUILD_RELAY_API_KEY: ${{ secrets.STATUS_BUILD_RELAY_API_KEY }}
          STATUS_BUILD_KLIPY_API_KEY: ${{ secrets.STATUS_BUILD_KLIPY_API_KEY }}
        run: |
          $IN_IMAGE ccache --zero-stats
          docker exec --env STATUS_BUILD_LIFI_API_KEY --env STATUS_BUILD_RELAY_API_KEY \
            --env STATUS_BUILD_KLIPY_API_KEY build make mobile-build PACKAGE_TYPE=apk
          ls -l mobile/bin/android/qt6/StatusPR.apk mobile/bin/android/qt6/StatusPR-mapping.txt

      - name: ccache statistics
        if: ${{ !cancelled() }}
        run: $IN_IMAGE ccache --show-stats --verbose

      # A failed build keeps what it compiled; a cancelled one may still be writing.
      # A cache saved by a pull request is not visible to other pull requests, so they only restore.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.ccache.outputs.cache-hit != 'true' }}
        with:
          path: .ccache
          key: ccache-android-${{ github.sha }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Status-android-arm64
          path: |
            mobile/bin/android/qt6/StatusPR.apk
            mobile/bin/android/qt6/StatusPR-mapping.txt
          if-no-files-found: error
          retention-days: 7
