name: macOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.0
  QT_MODULES: >-
    qtwebchannel qtwebview qtwebsockets qt5compat qtmultimedia qtwebengine
    qtpositioning qtserialport qtshadertools qtimageformats qtscxml qthttpserver
  NIMFLAGS: --colors:off
  FLAG_SWAP_ENABLED: 1
  FLAG_RELAY_ENABLED: 1
  FLAG_LIFI_ENABLED: 0
  FLAG_PARASWAP_ENABLED: 0
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  # The Makefile's default builds the disk image through Nix.
  DMGBUILD: dmgbuild

jobs:
  dmg:
    name: dmg
    # GitHub's macOS runners are Apple Silicon.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The app's version comes from git describe.
          fetch-depth: 0

      # With OpenSSL: the macOS build compiles it from mobile/vendors/openssl.
      - name: Fetch submodules
        env:
          USE_SYSTEM_NIM: '1'
        run: scripts/ci-fetch-submodules.sh --mobile

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: false

      - uses: ./.github/actions/macos-nim

      - name: Qt and dmgbuild
        run: |
          pipx install aqtinstall
          pipx install dmgbuild
          # shellcheck disable=SC2086
          aqt install-qt mac desktop "$QT_VERSION" clang_64 -m $QT_MODULES -O "$RUNNER_TEMP/qt"
          qt="$RUNNER_TEMP/qt/$QT_VERSION/macos"
          {
            echo "QTDIR=$qt"
            echo "QMAKE=$qt/bin/qmake"
            echo "MAKEFLAGS=-j$(sysctl -n hw.logicalcpu) V=1 USE_SYSTEM_NIM=1"
            echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.logicalcpu)"
          } >> "$GITHUB_ENV"
          echo "$qt/libexec" >> "$GITHUB_PATH"
          echo "$qt/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          xcodebuild -version
          go version
          protoc --version
          nim --version | head -n 1
          nimble --version | grep -F 'nimble v0.26.1'
          cmake --version | head -n 1
          qmake --version
          dmgbuild --help | head -n 1

      - name: Dependencies
        run: |
          make update
          make deps

      - name: status-go
        run: make status-go

      # MACOS_CODESIGN_IDENT is not set: the bundle is signed ad hoc.
      - name: Package
        run: make pkg-macos

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Status-macos-aarch64
          path: pkg/Status.dmg
          if-no-files-found: error
          retention-days: 7
