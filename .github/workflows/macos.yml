name: macOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.0
  QT_MODULES: >-
    qtwebchannel qtwebview qtwebsockets qt5compat qtmultimedia qtwebengine
    qtpositioning qtserialport qtshadertools qtimageformats qtscxml qthttpserver
  NIMFLAGS: --colors:off
  FLAG_SWAP_ENABLED: 1
  FLAG_RELAY_ENABLED: 1
  FLAG_LIFI_ENABLED: 0
  FLAG_PARASWAP_ENABLED: 0
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  # The Makefile's default builds the disk image through Nix.
  DMGBUILD: dmgbuild

jobs:
  dmg:
    name: dmg
    # GitHub's macOS runners are Apple Silicon.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The app's version comes from git describe.
          fetch-depth: 0

      - name: Fetch submodules
        env:
          USE_SYSTEM_NIM: '1'
        run: scripts/ci-fetch-submodules.sh

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: false

      # Prebuilt compilers: building Nim from source takes about five minutes each.
      - name: Nim, nimble and protoc
        run: |
          tools="$RUNNER_TEMP/toolchain"
          nightlies=https://github.com/nim-lang/nightlies/releases/download
          fetch() { # <directory> <sha256> <url> [tar options]
            local dir="$1" sum="$2" url="$3"
            shift 3
            mkdir -p "$dir"
            curl -sSfL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/download" "$url"
            echo "$sum  $RUNNER_TEMP/download" | shasum -a 256 -c -
            tar -xf "$RUNNER_TEMP/download" -C "$dir" "$@"
          }
          # Nim 2.2.10
          fetch "$tools/nim" 9a3b012d0680d11d6163dd2f145470b090c1045f5e634f42daf119bea1cb2b5e \
            "$nightlies/2026-04-24-version-2-2-bfeb3146d1638b39f69007a4ae5a23e23ae4e5ef/nim-2.2.10-macosx_arm64.tar.xz" \
            --strip-components=1
          # Nim 2.2.6, the compiler nim-sds pins. nimble builds it from source
          # unless it is already in its directory.
          fetch "$HOME/.nimble/nimbinaries/nim-2.2.6" a62ff3c34a2eb3fc69866fcae05b32dc5c2b6668ecfb1d10d91ad72c0183fae5 \
            "$nightlies/2025-10-31-version-2-2-ab00c56904e3126ad826bb520d243513a139436a/nim-2.2.6-macosx_arm64.tar.xz" \
            --strip-components=1
          # nimble 0.26.1
          fetch "$tools/nimble/bin" ec27b85cd743dee9814b34811cece487b53cb19a3b696e72c06a9bc4c9a18c42 \
            https://github.com/nim-lang/nimble/releases/download/v0.26.1/nimble-macosx_aarch64.tar.gz
          # protoc 36.0
          curl -sSfL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/download" \
            https://github.com/protocolbuffers/protobuf/releases/download/v36.0/protoc-36.0-osx-aarch_64.zip
          echo "b6bc4afdcb880124bf342851d05155b6e3d9b6e661236d87b9c614250d26ae00  $RUNNER_TEMP/download" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/download" -d "$tools/protoc"
          echo "$tools/protoc/bin" >> "$GITHUB_PATH"
          # Nim ships an older nimble next to the compiler; the path added last comes first.
          echo "$tools/nim/bin" >> "$GITHUB_PATH"
          echo "$tools/nimble/bin" >> "$GITHUB_PATH"

      - name: Qt and dmgbuild
        run: |
          pipx install aqtinstall
          pipx install dmgbuild
          # shellcheck disable=SC2086
          aqt install-qt mac desktop "$QT_VERSION" clang_64 -m $QT_MODULES -O "$RUNNER_TEMP/qt"
          qt="$RUNNER_TEMP/qt/$QT_VERSION/macos"
          {
            echo "QTDIR=$qt"
            echo "QMAKE=$qt/bin/qmake"
            echo "MAKEFLAGS=-j$(sysctl -n hw.logicalcpu) V=1 USE_SYSTEM_NIM=1"
            echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.logicalcpu)"
          } >> "$GITHUB_ENV"
          echo "$qt/libexec" >> "$GITHUB_PATH"
          echo "$qt/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          xcodebuild -version
          go version
          protoc --version
          nim --version | head -n 1
          nimble --version | grep -F 'nimble v0.26.1'
          cmake --version | head -n 1
          qmake --version
          dmgbuild --help | head -n 1

      - name: Dependencies
        run: |
          make update
          make deps

      - name: status-go
        run: make status-go

      # Not signed: MACOS_CODESIGN_IDENT is not set.
      - name: Package
        run: make pkg-macos

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Status-macos-aarch64
          path: pkg/Status.dmg
          if-no-files-found: error
          retention-days: 7
