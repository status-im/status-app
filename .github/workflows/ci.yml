name: ci

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.11.0'
  QT_MODULES: 'qtwebchannel qtwebview qtwebsockets qt5compat qtmultimedia qtwebengine qtpositioning qtserialport qtshadertools qtimageformats qtscxml qthttpserver'
  NIM_VERSION: '2.2.10'
  NIMBLE_VERSION: '0.26.0'
  GO_VERSION: '1.26.5'
  PROTOC_VERSION: '36.0'

jobs:
  desktop:
    name: 'status-app / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qt-host: linux
            qt-arch: linux_gcc_64
            qt-dir: gcc_64
          - os: macos-latest
            qt-host: mac
            qt-arch: clang_64
            qt-dir: macos
          - os: windows-latest
            qt-host: windows
            qt-arch: win64_msvc2022_64
            qt-dir: msvc2022_64
    defaults:
      run:
        shell: bash
    env:
      MAKEFLAGS: '-j4 V=1 USE_SYSTEM_NIM=1'
    steps:
      - uses: actions/checkout@v4

      - name: Allow long paths in git
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            libpcsclite-dev libssl-dev libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb-cursor-dev libfontconfig1 libdbus-1-3 \
            libpulse-dev libpulse-mainloop-glib0 libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 libnss3 libxcomposite1 libxtst6 \
            libxrandr2 libxcursor1 libxi6 libxcb-randr0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbfile1 libxslt1.1 libgtk-3-0 libcups2 libatk1.0-0

      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ env.QT_VERSION }}-${{ matrix.qt-arch }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          # Qt 6.11's Windows repository layout needs an unreleased aqtinstall.
          pip install -q "git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          python -m aqt install-qt ${{ matrix.qt-host }} desktop "$QT_VERSION" ${{ matrix.qt-arch }} \
            -m $QT_MODULES -O "${{ runner.temp }}/Qt" --timeout 3000

      - name: Put Qt on PATH
        run: |
          qtdir="$RUNNER_TEMP/Qt/$QT_VERSION/${{ matrix.qt-dir }}"
          if [ "${{ runner.os }}" = Windows ]; then qtdir=$(cygpath -u "$qtdir"); fi
          echo "QTDIR=$qtdir" >> "$GITHUB_ENV"
          echo "QMAKE=$qtdir/bin/qmake" >> "$GITHUB_ENV"
          cygpath -w "$qtdir/bin" 2>/dev/null >> "$GITHUB_PATH" || echo "$qtdir/bin" >> "$GITHUB_PATH"
          cygpath -w "$qtdir/libexec" 2>/dev/null >> "$GITHUB_PATH" || echo "$qtdir/libexec" >> "$GITHUB_PATH"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Nim ${{ env.NIM_VERSION }}
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            curl -sSfL -o nim.zip "https://nim-lang.org/download/nim-${NIM_VERSION}_x64.zip"
            unzip -q nim.zip -d "$HOME"
            cygpath -w "$HOME/nim-${NIM_VERSION}/bin" 2>/dev/null >> "$GITHUB_PATH" || echo "$HOME/nim-${NIM_VERSION}/bin" >> "$GITHUB_PATH"
          else
            curl -sSf https://nim-lang.org/choosenim/init.sh | sh -s -- -y
            "$HOME/.nimble/bin/choosenim" "$NIM_VERSION"
            cygpath -w "$HOME/.nimble/bin" 2>/dev/null >> "$GITHUB_PATH" || echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Nimble ${{ env.NIMBLE_VERSION }}
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   asset=linux_x64.tar.gz ;;
            macOS-ARM64) asset=macosx_aarch64.tar.gz ;;
            Windows-X64) asset=windows_x64.zip ;;
          esac
          mkdir -p "$HOME/nimble-bin"
          curl -sSfL -o "nimble-$asset" "https://github.com/nim-lang/nimble/releases/download/v${NIMBLE_VERSION}/nimble-$asset"
          case "$asset" in
            *.zip) unzip -q -o "nimble-$asset" -d "$HOME/nimble-bin" ;;
            *)     tar -xzf "nimble-$asset" -C "$HOME/nimble-bin" ;;
          esac
          cygpath -w "$HOME/nimble-bin" 2>/dev/null >> "$GITHUB_PATH" || echo "$HOME/nimble-bin" >> "$GITHUB_PATH"

      - name: Install protoc
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   asset=linux-x86_64 ;;
            macOS-ARM64) asset=osx-aarch_64 ;;
            Windows-X64) asset=win64 ;;
          esac
          curl -sSfL -o protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${asset}.zip"
          mkdir -p "$HOME/protoc" && unzip -q -o protoc.zip -d "$HOME/protoc"
          cygpath -w "$HOME/protoc/bin" 2>/dev/null >> "$GITHUB_PATH" || echo "$HOME/protoc/bin" >> "$GITHUB_PATH"

      - name: Load the MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }

      - name: Show toolchain
        run: |
          nim --version | head -1
          nimble --version | head -1
          go version
          qmake -v

      - name: Fetch submodules
        run: ./scripts/ci-fetch-submodules.sh ${{ runner.os == 'macOS' && '--mobile' || '' }}

      - name: make update
        run: make update

      - name: make deps
        run: make deps

      - name: make status-go
        run: make status-go

      - name: make statusq
        run: make statusq

      - name: make qrcodegen
        run: make qrcodegen

      - name: make nim_status_client
        run: make nim_status_client
