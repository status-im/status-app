name: iOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.0
  QT_MODULES: >-
    qtwebchannel qtwebview qtwebsockets qt5compat qtmultimedia qtconnectivity
    qtpositioning qtshadertools qtimageformats qtscxml qthttpserver
  # The tools of the host's Qt that the build runs.
  QT_HOST_MODULES: qt5compat qtshadertools qtscxml
  NIMFLAGS: --colors:off
  IPHONE_SDK: iphoneos
  ARCH: arm64
  BUILD_VARIANT: pr
  # Builds without a signature.
  QMAKE_EXTRA_CONFIG: fastlane
  # Goes into the build number.
  CHANGE_ID: ${{ github.event.pull_request.number }}
  FLAG_BUY_ENABLED: 1
  FLAG_SWAP_ENABLED: 1
  FLAG_RELAY_ENABLED: 1
  FLAG_LIFI_ENABLED: 0
  FLAG_PARASWAP_ENABLED: 0
  CMAKE_POLICY_VERSION_MINIMUM: 3.5

jobs:
  app:
    name: app
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The app's version comes from git describe.
          fetch-depth: 0

      - name: Fetch submodules
        env:
          USE_SYSTEM_NIM: '1'
        run: scripts/ci-fetch-submodules.sh --mobile

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: false

      - uses: ./.github/actions/macos-nim

      - name: Qt
        run: |
          pipx install aqtinstall
          # shellcheck disable=SC2086
          aqt install-qt mac desktop "$QT_VERSION" clang_64 -m $QT_HOST_MODULES -O "$RUNNER_TEMP/qt"
          # shellcheck disable=SC2086
          aqt install-qt mac ios "$QT_VERSION" ios -m $QT_MODULES -O "$RUNNER_TEMP/qt"
          qt="$RUNNER_TEMP/qt/$QT_VERSION/ios"
          host="$RUNNER_TEMP/qt/$QT_VERSION/macos"
          {
            echo "QTDIR=$qt"
            echo "QMAKE=$qt/bin/qmake"
            echo "QT_HOST_PATH=$host"
            echo "MAKEFLAGS=-j$(sysctl -n hw.logicalcpu) V=1 USE_SYSTEM_NIM=1"
            echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.logicalcpu)"
          } >> "$GITHUB_ENV"
          echo "$host/bin" >> "$GITHUB_PATH"
          echo "$host/libexec" >> "$GITHUB_PATH"
          echo "$qt/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          # go-generate-fast prints "file.go: command" lines, which setup-go's matcher reports as errors.
          echo "::remove-matcher owner=go::"
          xcodebuild -version
          xcrun --sdk "$IPHONE_SDK" --show-sdk-version
          xcbeautify --version
          go version
          protoc --version
          nim --version | head -n 1
          nimble --version | grep -F 'nimble v0.26.1'
          cmake --version | head -n 1
          qmake --version
          qmake -query QMAKE_XSPEC

      - name: Dependencies
        run: make update

      - name: App
        run: make mobile-build

      # The layout of an .ipa; it installs only after it is signed.
      - name: Package
        run: |
          app=mobile/bin/ios/qt6/StatusPR.app
          codesign --display --verbose=2 "$app" 2>&1 || true
          mkdir -p pkg/Payload
          cp -R "$app" pkg/Payload/
          (cd pkg && zip -qry StatusPR-unsigned.ipa Payload)
          ls -l pkg/StatusPR-unsigned.ipa

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Status-ios-arm64-unsigned
          path: pkg/StatusPR-unsigned.ipa
          # Compressed already.
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
