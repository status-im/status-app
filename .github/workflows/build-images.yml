name: Build images
# Publishes the images the desktop and Android jobs run in: one build for all of them, no mirrors at job time.
on:
  push:
    branches:
      - master
    paths:
      - 'ci/Dockerfile'
      - 'mobile/docker/Dockerfile'
      - 'ci/build-image.sh'
      - '.github/workflows/build-images.yml'
  # A pull request that changes an image publishes it too, so its other jobs
  # have something to pull. Forks cannot push packages and are skipped.
  pull_request:
    paths:
      - 'ci/Dockerfile'
      - 'mobile/docker/Dockerfile'
      - 'ci/build-image.sh'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  image:
    name: image (${{ matrix.image }})
    if: >-
      github.repository == 'status-im/status-app' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [desktop, android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Look for a published image
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.image }}
        run: |
          image="$(ci/build-image.sh --image "$NAME")"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Only a missing tag leads to a build; any other answer fails the job.
          if answer="$(docker manifest inspect "$image" 2>&1 >/dev/null)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$image is already published"
          elif [[ "$answer" != *"manifest unknown"* ]]; then
            echo "::error::The registry could not be asked about $image: $answer"
            exit 1
          fi
      - name: Build
        if: steps.image.outputs.published != 'true'
        env:
          NAME: ${{ matrix.image }}
        run: ci/build-image.sh "$NAME"
      - name: Check the tools
        if: steps.image.outputs.published != 'true'
        env:
          NAME: ${{ matrix.image }}
        run: ci/build-image.sh --check "$NAME"
      - name: Publish
        if: steps.image.outputs.published != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker push "$IMAGE"
