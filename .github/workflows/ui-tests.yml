name: UI Tests
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ui-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # One long-lived container; every step below runs a make target in it.
  IN_IMAGE: docker exec build
jobs:
  ui:
    name: ui
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # scripts/version.sh, run by every make call, needs the tags and the history.
          fetch-depth: 0
          filter: blob:none
      - name: Fetch submodules
        env:
          USE_SYSTEM_NIM: '1'
        run: scripts/ci-fetch-submodules.sh
      - uses: ./.github/actions/container
        id: container
        with:
          image: desktop
          env: |
            QML_DISABLE_DISK_CACHE=true
            QT_QPA_PLATFORM=offscreen
      - name: QML lint
        run: $IN_IMAGE make qml-lint
      - name: StatusQ tests
        if: ${{ !cancelled() && steps.container.outcome == 'success' }}
        run: $IN_IMAGE make run-statusq-tests
      - name: StatusQ sanity checker
        if: ${{ !cancelled() && steps.container.outcome == 'success' }}
        run: $IN_IMAGE make run-statusq-sanity-checker
      - name: Storybook tests
        if: ${{ !cancelled() && steps.container.outcome == 'success' }}
        run: $IN_IMAGE make run-storybook-tests
      - name: Storybook pages validator
        if: ${{ !cancelled() && steps.container.outcome == 'success' }}
        run: $IN_IMAGE make run-storybook-pages-validator
      - name: Translations are up to date
        if: ${{ !cancelled() && steps.container.outcome == 'success' }}
        run: |
          $IN_IMAGE make update-translations
          if ! git diff --quiet -- 'ui/i18n/*.ts'; then
            git diff --stat -- 'ui/i18n/*.ts'
            echo "::error::Translation files are out of date: run 'make update-translations' and commit the result."
            exit 1
          fi
