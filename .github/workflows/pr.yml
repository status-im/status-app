name: PR Checks

on:
  pull_request:
    branches:
      - master
      - release/**
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  check-status-go-submodule:
    name: Check the status-go pin's branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # head SHA, not head_ref: fork branches don't exist in this repo,
          # but their commits are fetchable by SHA via the PR ref network
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false

      - name: Get status-go pin
        id: statusgo
        run: |
          if ! commit=$(./scripts/status-go-pin.sh); then
            echo "::error::no status-go pin in nim_status_client.nimble"
            exit 1
          fi
          locked=$(python3 -c "import json; print(json.load(open('nimble.lock'))['packages'].get('statusgo',{}).get('vcsRevision',''))")
          if [ "$locked" != "$commit" ]; then
            echo "::error::nimble.lock pins status-go at '$locked' but nim_status_client.nimble requires '$commit'. Re-run 'nimble lock'."
            exit 1
          fi
          echo "commit=$commit" >> $GITHUB_OUTPUT
          echo "[LOG] status-go pin: $commit"

      - name: Get base branch status-go pin
        id: base
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          # An older base pins status-go as a submodule gitlink.
          base_commit=""
          if git show ${{ github.base_ref }}:nim_status_client.nimble > "$RUNNER_TEMP/base.nimble" 2>/dev/null; then
            base_commit=$(./scripts/status-go-pin.sh "$RUNNER_TEMP/base.nimble" 2>/dev/null || true)
          fi
          if [ -z "$base_commit" ]; then
            base_commit=$(git ls-tree ${{ github.base_ref }} vendor/status-go | awk '{print $3}')
          fi
          echo "commit=$base_commit" >> $GITHUB_OUTPUT
          echo "[LOG] status-go pin on base branch (${{ github.base_ref }}): ${base_commit:-<none>}"

      - name: Check if the status-go pin changed
        id: check_statusgo_changed
        run: |
          if [ "${{ steps.statusgo.outputs.commit }}" = "${{ steps.base.outputs.commit }}" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "[LOG] status-go pin NOT changed in this PR."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "[LOG] status-go pin changed in this PR."
          fi

      - name: Fetch relevant status-go branches
        if: steps.check_statusgo_changed.outputs.changed == 'true'
        run: |
          # The upstream URL is hardcoded so a PR cannot point the policy check
          # at a non-upstream remote.
          git clone --no-checkout --filter=blob:none \
            https://github.com/status-im/status-go.git status-go
          cd status-go
          if ! git fetch origin 'refs/heads/release/*:refs/remotes/origin/release/*' 2>/dev/null; then
            echo "[WARN] No release/* branches found."
          fi
          if ! git fetch origin develop:refs/remotes/origin/develop 2>/dev/null; then
            echo "[WARN] develop branch not found on remote."
          fi
          # The pin itself, so the policy step reports an off-branch commit, not a git error.
          if ! git fetch --filter=blob:none origin "${{ steps.statusgo.outputs.commit }}"; then
            echo "::error::the status-go pin ${{ steps.statusgo.outputs.commit }} is not reachable from upstream status-go."
            exit 1
          fi
          echo "[LOG] status-go relevant branches fetched."

      - name: Get containing branches
        id: branches
        if: steps.check_statusgo_changed.outputs.changed == 'true'
        run: |
          cd status-go
          branches=$(git branch -r --contains ${{ steps.statusgo.outputs.commit }} | sed 's/ *origin\///')
          # Normalize branch list: remove 'HEAD -> ...', trim whitespace, one per line
          cleaned_branches=$(echo "$branches" | sed '/HEAD ->/d' | awk '{$1=$1};1')
          echo "branches<<EOF" >> $GITHUB_OUTPUT
          echo "$cleaned_branches" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "[LOG] status-go commit is contained in branches:"
          echo "$cleaned_branches"

      - name: Validate status-go branch policy for master
        if: steps.check_statusgo_changed.outputs.changed == 'true' && github.base_ref == 'master'
        run: |
          BRANCHES="${{ steps.branches.outputs.branches }}"
          echo "[LOG] Checking branch policy for master branch"
          if ! echo "$BRANCHES" | grep -x 'develop'; then
            echo "::error::the status-go pin must be a commit on 'develop' when the PR targets master."
            exit 1
          fi
          echo "[LOG] status-go commit is on develop branch."

      - name: Validate status-go branch policy for release
        if: steps.check_statusgo_changed.outputs.changed == 'true' && startsWith(github.base_ref, 'release/')
        run: |
          BRANCHES="${{ steps.branches.outputs.branches }}"
          echo "[LOG] Checking branch policy for release branch: ${{ github.base_ref }}"
          if ! echo "$BRANCHES" | grep -E '^release/' >/dev/null; then
            echo "::error::the status-go pin must be a commit on a 'release/*' branch when the PR targets a release branch."
            exit 1
          fi
          echo "[LOG] status-go commit is on a release/* branch."

      - name: Validate status-go commit recency
        if: steps.check_statusgo_changed.outputs.changed == 'true'
        run: |
          STATUS_GO_COMMIT="${{ steps.statusgo.outputs.commit }}"
          BASE_STATUS_GO_COMMIT="${{ steps.base.outputs.commit }}"
          if [ -z "$BASE_STATUS_GO_COMMIT" ]; then
            echo "[WARN] the base branch names no status-go pin; skipping the recency check."
            exit 0
          fi
          echo "[LOG] Checking commit recency: PR=$STATUS_GO_COMMIT, base=$BASE_STATUS_GO_COMMIT"
          cd status-go
          git fetch --filter=blob:none origin "$BASE_STATUS_GO_COMMIT"
          if git merge-base --is-ancestor "$BASE_STATUS_GO_COMMIT" "$STATUS_GO_COMMIT"; then
            echo "[LOG] status-go commit is newer than or equal to base branch. OK."
          else
            echo "::error::the status-go pin in this PR is older than the one on the base branch."
            exit 1
          fi
  wakuext-binding-contract:
    name: wakuext FFI binding contract
    runs-on: ubuntu-latest
    steps:
      # default (merge) ref on purpose: the contract must hold on the result of
      # merging the PR, not on the PR's possibly-stale pin
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Materialize the pinned status-go
        run: |
          # The script hardcodes the upstream URL: never fetch a PR-supplied remote.
          ./scripts/status-go-checkout.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest==8.4.1
      - name: Run the binding contract
        run: python -m pytest test/contract/test_wakuext_binding.py -v
