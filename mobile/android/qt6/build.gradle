buildscript {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.0'
    }
}

repositories {
    mavenLocal()
    google()
    mavenCentral()
}

apply plugin: qtGradlePluginType

configurations.all { config ->
    config.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    config.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    //noinspection GradleDependency
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    implementation 'im.status:mobileui-android:0.0.0-local'
}

// qtAndroidDir is generated by androiddeployqt in gradle.properties with the
// correct local Qt installation path. Do not override.
def qtDir = qtAndroidDir

// Build variant: 'pr' or 'release' (controls app ID and name)
def buildVariant = System.getenv("BUILD_VARIANT") ?: "release"

android {
    /*******************************************************
     * The following variables:
     * - androidBuildToolsVersion,
     * - androidCompileSdkVersion
     * - qtAndroidDir - holds the path to qt android files
     *                   needed to build any Qt application
     *                   on Android.
     * - qtGradlePluginType - whether to build an app or a library
     *
     * are defined in gradle.properties file. This file is
     * generated by androiddeployqt from the CMake configuration.
     * Changing them manually might break the compilation!
     *******************************************************/

    namespace = androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion = androidNdkVersion

    buildFeatures {
        aidl true
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError = false
    }

    // Do not compress Qt binary resources file
    aaptOptions {
        noCompress 'rcc'
    }

    defaultConfig {
        resConfig "en"
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")
        // Use FDROID_VERSION_CODE env var if set, otherwise generate from timestamp
        versionCode = System.getenv("FDROID_VERSION_CODE")?.toInteger() ?: (System.currentTimeMillis() / 60000).toInteger()
        // Set applicationId and app name based on build variant
        applicationId = buildVariant == 'release' ? "app.status.mobile" : "app.status.mobile.pr"
        resValue "string", "app_name", buildVariant == 'release' ? "Status" : "Status PR"
        // lib_name must match OUTPUT_NAME in CMakeLists.txt
        resValue "string", "lib_name", buildVariant == 'release' ? "Status" : "StatusPR"
    }

    buildTypes {
        release {
            debuggable = false
            minifyEnabled = false
        }
        debug {
            debuggable = true
            applicationIdSuffix ".debug"
            resValue "string", "app_name",
                buildVariant == 'release' ? "Status Debug" : "Status PR Debug"
        }
    }
}
