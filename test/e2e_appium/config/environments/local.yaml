extends: "base.yaml"

metadata:
  name: "local"
  description: "Local development environment"

provider:
  name: "local"
  options:
    server_url: "http://localhost:4723"
    app:
      source: "local_file"
      path_template: "${LOCAL_APP_PATH:-}"

execution:
  concurrency:
    max_sessions: 2
    per_device_limit: 2
  retry_failed_tests: 0

devices:
  default: "pixel_8_emulator"
  matrix:
    - id: "pixel_8_emulator"
      display_name: "Pixel 8 Emulator"
      tags: ["emulator", "phone", "android"]
      capabilities:
        platformName: "android"
        platformVersion: "15"
        deviceName: "sdk_gphone64_arm64"
        automationName: "UiAutomator2"
        newCommandTimeout: 300
        noReset: false
        appium:udid: "${ANDROID_UDID:-emulator-5554}"
        appPackage: "app.status.mobile"
        appActivity: "app.status.mobile.StatusQtActivity"
        unicodeKeyboard: true
        resetKeyboard: false
    - id: "android_tv_emulator"
      display_name: "Android TV Emulator"
      tags: ["emulator", "android", "tv"]
      capabilities:
        platformName: "android"
        platformVersion: "14"
        deviceName: "sdk_google_atv64_arm64"
        automationName: "UiAutomator2"
        newCommandTimeout: 300

    - id: "iphone_15_local"
      display_name: "iPhone 15 (USB, TestFlight build)"
      tags: ["ios", "phone", "local"]
      capabilities:
        platformName: "iOS"
        platformVersion: "26.1"
        deviceName: "iPhone"
        automationName: "XCUITest"
        appium:udid: "${IOS_UDID:-}"
        bundleId: "app.status.mobile"
        noReset: true
        newCommandTimeout: 300
        appium:webDriverAgentUrl: "${WDA_URL:-http://localhost:8101}"
        wdaConnectionTimeout: 120000
        # iOS permission alerts (local network, notifications) are system
        # dialogs outside the QML tree; accept them so flows keep moving.
        autoAcceptAlerts: true
    - id: "iphone_16_sim"
      display_name: "iPhone 16 simulator (local build)"
      tags: ["ios", "phone", "local", "simulator"]
      capabilities:
        platformName: "iOS"
        platformVersion: "18.4"
        deviceName: "iPhone 16"
        automationName: "XCUITest"
        appium:udid: "${IOS_SIM_UDID:-}"
        bundleId: "app.status.mobile"
        noReset: true
        newCommandTimeout: 300
        wdaLaunchTimeout: 240000
        autoAcceptAlerts: true
timeouts:
  default: 60
  element_wait: 30
  element_find: 10
  element_click: 10

logging:
  level: "DEBUG"
